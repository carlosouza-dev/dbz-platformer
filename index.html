<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBZ</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="shortcut icon" href="assets/images/icon.png" type="image/x-png">
</head>
<body>
    <audio src="assets/audios/background-sound.mp3" autoplay loop class="audio"></audio>
    <div class="game-background">
        <h1 class="score">0</h1>
        <div class="clouds"></div>
        <div class="mountains-far-away"></div>
        <div class="mountains-closer"></div>
        <img class="persona">

        <div class="game-over">
            <div class="game-over-box">
                <h1 id="game-over-title">GAME OVER</h1>
                <h1 id="score-final">34</h1>
                <button class="restart-btn">RESTART</button>
            </div>
        </div>
    </div>

    <script src="js/Obstacle.js"></script>
    <script src="js/EnergyBall.js"></script>
    <script src="js/Event.js"></script>
    <script src="js/DeathEvent.js"></script>
    <script src="js/LevelUpEvent.js"></script>
    <script src="js/GameOverScreen.js"></script>
    <script src="js/Score.js"></script>
    <script src="js/Persona.js"></script>
    <script src="js/Goku.js"></script>
    <script src="js/Layer.js"></script>
    <script src="js/index.js"></script>
    
</body>
</html>
